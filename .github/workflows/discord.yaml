name: Lilium Discord Notifications

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "bugfix/**"
      - "fix/**"
      - "enhancement/**"

  pull_request:
    branches:
      - master
      - develop

  delete: # branch deleted

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────
      # PUSH (commit real, no branch)
      # ─────────────────────────────
      - name: Push notification
        if: github.event_name == 'push' && github.event.created == false
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        with:
          args: |
            🟢 **Push**
            👤 **Actor:** ${{ github.actor }}
            🌿 **Branch:** `${{ github.ref_name }}`
            📦 **Repo:** ${{ github.repository }}

            💬 **Mensaje:**  
            > ${{ github.event.head_commit.message }}

            🔗 **Commit:** `${{ github.sha }}`
            🔎 [Ver cambios](${{ github.event.head_commit.url }})

      # ─────────────────────────────
      # BRANCH CREATED
      # ─────────────────────────────
      - name: Branch created
        if: github.event_name == 'push' && github.event.created == true
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        with:
          args: |
            🌱 **Nueva branch creada**
            👤 **Actor:** ${{ github.actor }}
            🌿 **Branch:** `${{ github.ref_name }}`
            📦 **Repo:** ${{ github.repository }}

      # ─────────────────────────────
      # BRANCH DELETED
      # ─────────────────────────────
      - name: Branch deleted
        if: github.event_name == 'delete' && github.event.ref_type == 'branch'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        with:
          args: |
            🧹 **Branch eliminada**
            👤 **Actor:** ${{ github.actor }}
            🌿 **Branch:** `${{ github.event.ref }}`
            📦 **Repo:** ${{ github.repository }}

      # ─────────────────────────────
      # PULL REQUEST
      # ─────────────────────────────
      - name: Pull Request notification
        if: github.event_name == 'pull_request'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        with:
          args: |
            🔵 **Pull Request**
            👤 **Actor:** ${{ github.actor }}
            📦 **Repo:** ${{ github.repository }}

            🧩 **PR #${{ github.event.pull_request.number }}**
            **${{ github.event.pull_request.title }}**

            📝 ${{ github.event.pull_request.body || '_(sin descripción)_' }}

            🔎 [Ver Pull Request](${{ github.event.pull_request.html_url }})

name: Lilium Discord Notifications

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "bugfix/**"
      - "fix/**"
      - "enhancement/**"
      - "test/**"

  pull_request:
    branches:
      - master
      - develop

  delete: # branch deleted

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────
      # PUSH (commit real, no branch)
      # ─────────────────────────────
      - name: Push notification
        if: github.event_name == 'push' && github.event.created == false
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          echo "${{ github.event.head_commit.message }}"
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [
                {
                  "title": "🟢 New push",
                  "description": "**${{ github.repository }}**",
                  "color": 3066993,
                  "fields": [
                    {
                      "name": "👤 Author",
                      "value": "${{ github.actor }}",
                      "inline": true
                    },
                    {
                      "name": "🌿 Branch",
                      "value": "${{ github.ref_name }}",
                      "inline": true
                    },
                    {
                      "name": "💬 Commit message",
                      "value": "${{ github.event.head_commit.message }}"
                    },
                    {
                      "name": "🔗 Commit",
                      "value": "[View changes](${{ github.event.head_commit.url }})"
                    }
                  ],
                  "footer": {
                    "text": "Lilium · GitHub Actions"
                  }
                }
              ]
            }' \
            "$DISCORD_WEBHOOK"

      # ─────────────────────────────
      # BRANCH CREATED
      # ─────────────────────────────
      - name: Branch created
        if: github.event_name == 'push' && github.event.created == true
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [
                {
                  "title": "🌱 Branch created",
                  "description": "**${{ github.repository }}**",
                  "color": 15105570,
                  "fields": [
                    {
                      "name": "🌿 Branch",
                      "value": "${{ github.ref_name }}",
                      "inline": true
                    },
                    {
                      "name": "👤 Author",
                      "value": "${{ github.actor }}",
                      "inline": true
                    }
                  ],
                  "footer": {
                    "text": "Lilium · Branch lifecycle"
                  }
                }
              ]
            }' \
            "$DISCORD_WEBHOOK"

      # ─────────────────────────────
      # BRANCH DELETED
      # ─────────────────────────────
      - name: Branch deleted
        if: github.event_name == 'delete' && github.event.ref_type == 'branch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}

        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [
                {
                  "title": "🌱 Branch deleted",
                  "description": "**${{ github.repository }}**",
                  "color": 15105570,
                  "fields": [
                    {
                      "name": "🌿 Branch",
                      "value": "${{ github.ref_name }}",
                      "inline": true
                    },
                    {
                      "name": "👤 Author",
                      "value": "${{ github.actor }}",
                      "inline": true
                    }
                  ],
                  "footer": {
                    "text": "Lilium · Branch lifecycle"
                  }
                }
              ]
            }' \
            "$DISCORD_WEBHOOK"

      # ─────────────────────────────
      # PULL REQUEST
      # ─────────────────────────────
      - name: Pull Request notification
        if: github.event_name == 'pull_request'
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [
                {
                  "title": "🔵 Pull Request #${{ github.event.pull_request.number }}",
                  "url": "${{ github.event.pull_request.html_url }}",
                  "description": "**${{ github.event.pull_request.title }}**",
                  "color": 3447003,
                  "fields": [
                    {
                      "name": "👤 Author",
                      "value": "${{ github.actor }}",
                      "inline": true
                    },
                    {
                      "name": "🌿 Base → Head",
                      "value": "`${{ github.event.pull_request.base.ref }}` ← `${{ github.event.pull_request.head.ref }}`",
                      "inline": true
                    },
                    {
                      "name": "📝 Description",
                      "value": "${{ github.event.pull_request.body || '_No description provided_' }}"
                    }
                  ],
                  "footer": {
                    "text": "Lilium · Pull Requests"
                  }
                }
              ]
            }' \
            "$DISCORD_WEBHOOK"

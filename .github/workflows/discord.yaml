name: Lilium Discord Notifications

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "bugfix/**"
      - "fix/**"
      - "enhancement/**"
      - "test/**"

  pull_request:
    branches:
      - master
      - develop

  delete: # branch deleted

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────
      # PUSH (commit real, no branch)
      # ─────────────────────────────
      - name: Push notification
        if: github.event_name == 'push' && github.event.created == false
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          BRANCH="${{ github.ref_name }}"

          if [[ "$BRANCH" == "master" ]]; then
            ENVIRONMENT="Production"
            COLOUR=15158332
          elif [[ "$BRANCH" == "develop" ]]; then
            ENVIRONMENT="Development"
            COLOUR=3066993
          else
            ENVIRONMENT="Local"
            COLOUR=15844367
          fi

          jq -n \
            --arg branch "$BRANCH" \
            --arg env "$ENVIRONMENT" \
            --arg url "${{ github.event.head_commit.url }}" \
            --argjson colour $COLOUR \
            '{
              embeds: [
                {
                  title: "🟢 Push detected",
                  color: $colour,
                  fields: [
                    { name: "🌿 Branch", value: $branch, inline: true },
                    { name: "⚙ Environment", value: $env, inline: true }
                  ],
                  footer: { text: "Lilium · Commit Event" }
                }
              ],
              content: $url,
            }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"

      # ─────────────────────────────
      # BRANCH CREATED
      # ─────────────────────────────
      - name: Branch created
        if: github.event_name == 'push' && github.event.created == true
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg author "${{ github.actor }}" \
            --arg branch "${{ github.ref_name }}" \
            '{
              embeds: [
                {
                  title: "🌱 Branch created",
                  description: ("**" + $repo + "**"),
                  color: 15105570,
                  fields: [
                    { name: "🌿 Branch", value: $branch, inline: true },
                    { name: "👤 Author", value: $author, inline: true }
                  ],
                  footer: { text: "Lilium · Branch Lifecycle" }
                }
              ]
            }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"

      # ─────────────────────────────
      # BRANCH DELETED
      # ─────────────────────────────
      - name: Branch deleted
        if: github.event_name == 'delete' && github.event.ref_type == 'branch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg author "${{ github.actor }}" \
            --arg branch "${{ github.event.ref }}" \
            '{
              embeds: [
                {
                  title: "🧹 Branch deleted",
                  description: ("**" + $repo + "**"),
                  color: 15158332,
                  fields: [
                    { name: "🌿 Branch", value: $branch, inline: true },
                    { name: "👤 Author", value: $author, inline: true }
                  ],
                  footer: { text: "Lilium · Branch Lifecycle" }
                }
              ]
            }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"

      # ─────────────────────────────
      # PULL REQUEST
      # ─────────────────────────────
      - name: Pull Request notification
        if: github.event_name == 'pull_request'
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg base "${{ github.event.pull_request.base.ref }}" \
            --arg head "${{ github.event.pull_request.head.ref }}" \
            --arg url "${{ github.event.pull_request.html_url }}" \
            '{
                content: $url,
                embeds: [
                  {
                    title: "🔵 Pull Request Activity",
                    color: 3447003,
                    fields: [
                      { name: "🌿 Base → Head", value: ($base + " ← " + $head), inline: true },
                      { name: "🚦 Target", value: $base, inline: true }
                    ],
                    footer: { text: "Lilium · Pull Request Event" }
                  }
                ]
              }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"

name: Lilium Discord Notifications

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "bugfix/**"
      - "fix/**"
      - "enhancement/**"
      - "test/**"

  pull_request:
    branches:
      - master
      - develop

  delete: # branch deleted

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────
      # PUSH (commit real, no branch)
      # ─────────────────────────────
      - name: Push notification
        if: github.event_name == 'push' && github.event.created == false
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"<${{ github.event.head_commit.url }}>\"
            }" \
            "$DISCORD_WEBHOOK"

      # ─────────────────────────────
      # BRANCH CREATED
      # ─────────────────────────────
      - name: Branch created
        if: github.event_name == 'push' && github.event.created == true
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg author "${{ github.actor }}" \
            --arg branch "${{ github.ref_name }}" \
            '{
              embeds: [
                {
                  title: "🌱 Branch created",
                  description: ("**" + $repo + "**"),
                  color: 15105570,
                  fields: [
                    { name: "🌿 Branch", value: $branch, inline: true },
                    { name: "👤 Author", value: $author, inline: true }
                  ],
                  footer: { text: "Lilium · Branch lifecycle" }
                }
              ]
            }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"

      # ─────────────────────────────
      # BRANCH DELETED
      # ─────────────────────────────
      - name: Branch deleted
        if: github.event_name == 'delete' && github.event.ref_type == 'branch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg author "${{ github.actor }}" \
            --arg branch "${{ github.event.ref }}" \
            '{
              embeds: [
                {
                  title: "🧹 Branch deleted",
                  description: ("**" + $repo + "**"),
                  color: 15158332,
                  fields: [
                    { name: "🌿 Branch", value: $branch, inline: true },
                    { name: "👤 Author", value: $author, inline: true }
                  ],
                  footer: { text: "Lilium · Branch lifecycle" }
                }
              ]
            }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"

      # ─────────────────────────────
      # PULL REQUEST
      # ─────────────────────────────
      - name: Pull Request notification
        if: github.event_name == 'pull_request'
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          BODY="${{ github.event.pull_request.body }}"
          if [ -z "$BODY" ]; then
            BODY="No description provided."
          fi

          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg author "${{ github.actor }}" \
            --arg title "${{ github.event.pull_request.title }}" \
            --arg number "${{ github.event.pull_request.number }}" \
            --arg base "${{ github.event.pull_request.base.ref }}" \
            --arg head "${{ github.event.pull_request.head.ref }}" \
            --arg body "$BODY" \
            --arg url "${{ github.event.pull_request.html_url }}" \
            '{
              embeds: [
                {
                  title: ("🔵 Pull Request #" + $number),
                  url: $url,
                  description: ("**" + $title + "**"),
                  color: 3447003,
                  fields: [
                    { name: "👤 Author", value: $author, inline: true },
                    { name: "🌿 Base → Head", value: ($base + " ← " + $head), inline: true },
                    { name: "📝 Description", value: $body }
                  ],
                  footer: { text: "Lilium · Pull Requests" }
                }
              ]
            }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"

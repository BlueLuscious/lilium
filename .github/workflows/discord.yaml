name: Lilium Discord Notifications

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "bugfix/**"
      - "fix/**"
      - "enhancement/**"
      - "test/**"

  pull_request:
    branches:
      - master
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - closed

  delete: # branch deleted

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # PUSH (commit)
      # ─────────────────────────────────────
      - name: Push notification
        if: github.event_name == 'push' && github.event.created == false
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          BRANCH="${{ github.ref_name }}"

          if [[ "$BRANCH" == "master" ]]; then
            ENVIRONMENT="Production"
            COLOUR=15158332
          elif [[ "$BRANCH" == "develop" ]]; then
            ENVIRONMENT="Development"
            COLOUR=3066993
          else
            ENVIRONMENT="Local"
            COLOUR=15844367
          fi

          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg branch "$BRANCH" \
            --arg env "$ENVIRONMENT" \
            --arg sha "${{ github.sha }}" \
            --arg url "${{ github.event.head_commit.url }}" \
            --argjson colour $COLOUR \
            '{
              embeds: [
                {
                  title: "🟢 New commit",
                  color: $colour,
                  fields: [
                    { name: "🌿 Branch", value: "`\($branch)`", inline: true },
                    { name: "⚙ Environment", value: "`\($env)`", inline: true }
                  ],
                  "image": {
                    "url": ("https://opengraph.githubassets.com/" + $sha + "/" + $repo + "/commit/" + $sha)
                  },
                  footer: { text: "Lilium · Commit Event" }
                }
              ]
            }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"

      # ─────────────────────────────────────
      # BRANCH CREATED
      # ─────────────────────────────────────
      - name: Branch created
        if: github.event_name == 'push' && github.event.created == true
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg author "${{ github.actor }}" \
            --arg branch "${{ github.ref_name }}" \
            --argjson colour 15105570 \
            '{
              embeds: [
                {
                  title: "🌱 Branch created",
                  description: ("**" + $repo + "**"),
                  color: $colour,
                  fields: [
                    { name: "🌿 Branch", value: "`\($branch)`", inline: true },
                    { name: "👤 Author", value: "`\($author)`", inline: true }
                  ],
                  footer: { text: "Lilium · Branch Lifecycle" }
                }
              ]
            }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"

      # ─────────────────────────────────────
      # BRANCH DELETED
      # ─────────────────────────────────────
      - name: Branch deleted
        if: github.event_name == 'delete' && github.event.ref_type == 'branch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg author "${{ github.actor }}" \
            --arg branch "${{ github.event.ref }}" \
            --argjson colour 15158332 \
            '{
              embeds: [
                {
                  title: "🧹 Branch deleted",
                  description: ("**" + $repo + "**"),
                  color: $colour,
                  fields: [
                    { name: "🌿 Branch", value: "`\($branch)`", inline: true },
                    { name: "👤 Author", value: "`\($author)`", inline: true }
                  ],
                  footer: { text: "Lilium · Branch Lifecycle" }
                }
              ]
            }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"

      # ─────────────────────────────────────
      # PULL REQUEST
      # ─────────────────────────────────────
      - name: Pull Request notification
        if: github.event_name == 'pull_request' &&
          (github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'synchronize')
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg base "${{ github.event.pull_request.base.ref }}" \
            --arg head "${{ github.event.pull_request.head.ref }}" \
            --arg number "${{ github.event.pull_request.number }}" \
            --arg sha "${{ github.event.pull_request.head.sha }}" \
            --argjson colour 3447003 \
            '{
              embeds: [
                {
                  title: ("🔵 Pull Request #" + $number),
                  color: $colour,
                  description: "🌿 `\($head)` → 🚦 `\($base)`",
                  image: {
                    url: ("https://opengraph.githubassets.com/" + $sha + "/" + $repo + "/pull/" + $number)
                  },
                  footer: { text: "Lilium · Pull Request Event" }
                }
              ]
            }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"

      # ─────────────────────────────────────
      # PULL REQUEST MERGED
      # ─────────────────────────────────────
      - name: Pull Request merged
        if: github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg base "${{ github.event.pull_request.base.ref }}" \
            --arg head "${{ github.event.pull_request.head.ref }}" \
            --arg number "${{ github.event.pull_request.number }}" \
            --arg author "${{ github.actor }}" \
            --argjson colour 5763719 \
            '{
              embeds: [
                {
                  title: "🟣 Pull Request Merged",
                  description: ("🌿 `\($head)` → 🚀 `\($base)`),
                  color: $colour,
                  fields: [
                    { name: "🔢 PR", value: ("#" + $number), inline: true },
                    { name: "👤 Merged by", value: "`\($author)`", inline: true }
                  ],
                  footer: { text: "Lilium · Pull Request Merge Event" }
                }
              ]
            }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"

      # ─────────────────────────────────────────────
      # PULL REQUEST CLOSED WITHOUT MERGED
      # ─────────────────────────────────────────────
      - name: Pull Request closed without merge
        if: github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == false
        env:
          DISCORD_WEBHOOK: ${{ secrets.LILIUM_DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg base "${{ github.event.pull_request.base.ref }}" \
            --arg head "${{ github.event.pull_request.head.ref }}" \
            --arg number "${{ github.event.pull_request.number }}" \
            --arg author "${{ github.actor }}" \
            --argjson colour 15158332 \
            '{
              embeds: [
                {
                  title: "🔴 Pull Request Closed",
                  description: ("🌿 `\($head)` → 🚦 `\($base)`"),
                  color: $colour,
                  fields: [
                    { name: "🔢 PR", value: ("#" + $number), inline: true },
                    { name: "👤 Closed by", value: "`\($author)`", inline: true }
                  ],
                  footer: { text: "Lilium · Pull Request Closed Event" }
                }
              ]
            }' \
          | curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @- \
              "$DISCORD_WEBHOOK"
